<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff1d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мем-Кот">
<link rel="manifest" href="manifest.webmanifest">
<title>🐱 Мем-Кот</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff1d6,#e5f4ff);color:#222;overscroll-behavior:none}
button{font:inherit}
.app{max-width:760px;margin:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
.card{background:#ffffffdf;border:1px solid #fff;border-radius:24px;padding:14px;box-shadow:0 10px 30px #0001}
h1{text-align:center;margin:2px 0 0;font-size:30px}.sub{text-align:center;color:#666;font-size:14px;margin:2px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f7f7f7;border-radius:15px;padding:8px}.stat b{font-size:12px}.bar{height:11px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;width:50%;transition:.3s}
#hfill{background:#ff9f43}#ffill{background:#ff6b81}#efill{background:#54a0ff}#wfill{background:#1dd1a1}
.info{text-align:center;font-weight:800;margin:9px 0}
.scene{position:relative;height:min(62vh,500px);min-height:330px;border-radius:20px;overflow:hidden;background:linear-gradient(#dcefff 0 65%,#d7f2c9 65%);touch-action:manipulation}
.catwrap{position:absolute;inset:45px 6% 0;display:flex;align-items:flex-end;justify-content:center}
.cat{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 10px #0002);user-select:none;pointer-events:none}
.meme{position:absolute;z-index:2;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #222;border-radius:15px;padding:8px 12px;font-weight:900;font-size:clamp(16px,4.5vw,24px);text-align:center;max-width:90%;box-shadow:4px 4px #222;display:none}.meme.show{display:block;animation:pop .2s}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}to{transform:translateX(-50%) scale(1)}}
@keyframes jump{50%{transform:translateY(-20px) rotate(-2deg)}}.jump{animation:jump .5s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}.shake{animation:shake .45s}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
button{border:0;border-radius:16px;padding:13px 5px;background:#fff;box-shadow:0 4px 0 #bbb;font-weight:800;min-height:52px;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px #bbb}
.log{margin-top:10px;background:#171717;color:#fff;border-radius:15px;padding:9px;height:80px;overflow:auto;font-size:12px}
.note{text-align:center;color:#777;font-size:11px;margin-top:8px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.buttons{grid-template-columns:repeat(5,1fr)}.scene{height:500px}}
</style>
</head>
<body>
<div class="app"><div class="card">
<h1>🐱 Мем-Кот</h1><div class="sub">Твой виртуальный кот. Береги его и открывай мемы!</div>
<div class="stats">
<div class="stat"><b>🍗 Голод</b><div class="bar"><div id="hfill" class="fill"></div></div></div>
<div class="stat"><b>❤️ Настроение</b><div class="bar"><div id="ffill" class="fill"></div></div></div>
<div class="stat"><b>⚡ Энергия</b><div class="bar"><div id="efill" class="fill"></div></div></div>
<div class="stat"><b>🧼 Чистота</b><div class="bar"><div id="wfill" class="fill"></div></div></div>
</div>
<div class="info">🪙 <span id="coins">0</span> &nbsp; 🏆 Уровень <span id="level">1</span></div>
<div class="scene"><div id="meme" class="meme"></div><div class="catwrap"><img id="cat" class="cat"></div></div>
<div class="buttons">
<button onclick="act('feed')">🍗<br>Покормить</button>
<button onclick="act('play')">🎮<br>Играть</button>
<button onclick="act('sleep')">😴<br>Спать</button>
<button onclick="act('wash')">🛁<br>Мыть</button>
<button onclick="act('pet')">🥰<br>Гладить</button>
<button onclick="act('work')">💰<br>Заработать</button>
<button onclick="act('meme')">😂<br>Мем!</button>
<button onclick="resetGame()">🔄<br>Сброс</button>
</div>
<div id="log" class="log"></div>

function render(){["hunger","fun","energy","clean"].forEach((k,i)=>document.getElementById(["hfill","ffill","efill","wfill"][i]).style.width=s[k]+"%");coins.textContent=s.coins;level.textContent=s.level}
function log(t){let e=document.getElementById("log");e.innerHTML="<div>• "+t+"</div>"+e.innerHTML}
function meme(t){let e=document.getElementById("meme");e.textContent=t;e.classList.remove("show");void e.offsetWidth;e.classList.add("show");clearTimeout(window.mt);window.mt=setTimeout(()=>e.classList.remove("show"),2400)}
function anim(shake=false){let c=cat;c.classList.remove("jump","shake");void c.offsetWidth;c.classList.add(shake?"shake":"jump")}
function xp(n){s.xp+=n;let need=s.level*60;if(s.xp>=need){s.xp-=need;s.level++;s.coins+=10;meme("🎉 УРОВЕНЬ "+s.level+"!");log("Кот получил уровень и 10 монет!")}}
function act(a){
 if(a=="feed"){s.hunger=clamp(s.hunger+24);s.fun=clamp(s.fun+2);s.coins=Math.max(0,s.coins-1);log("🍗 Кот поел.");meme("ЕЩЁ!")}
 if(a=="play"){s.fun=clamp(s.fun+25);s.energy=clamp(s.energy-16);s.hunger=clamp(s.hunger-7);xp(12);log("🎮 Кот наигрался.");meme("ЗАБАВНО 😹")}
 if(a=="sleep"){s.energy=clamp(s.energy+35);s.fun=clamp(s.fun-4);log("😴 Кот спит.");meme("zzz...")}
 if(a=="wash"){s.clean=clamp(s.clean+35);s.fun=clamp(s.fun-5);log("🛁 Кот чистый, но недоволен.");meme("ЗАЧЕМ МЫТЬ?!");}
 if(a=="pet"){s.fun=clamp(s.fun+15);xp(5);log("🥰 Кот мурчит.");meme("МРРРР")}
 if(a=="work"){s.energy=clamp(s.energy-12);s.fun=clamp(s.fun-4);s.coins+=5;xp(8);log("💰 Кот заработал 5 монет.");meme("БИЗНЕС ИДЁТ")}
 if(a=="meme"){meme(memes[Math.floor(Math.random()*memes.length)]);s.fun=clamp(s.fun+7);xp(3);log("😂 Мем показан.")}
 anim(a=="wash"||a=="play");save();render();
}
function resetGame(){if(confirm("Начать заново?")){localStorage.removeItem("memCatMobile");location.reload()}}
setInterval(()=>{s.hunger=clamp(s.hunger-2);s.fun=clamp(s.fun-1);s.clean=clamp(s.clean-.7);s.energy=clamp(s.energy-.6);if(s.hunger<20||s.fun<20||s.energy<15||s.clean<20)meme("МНЕ НУЖНА ЗАБОТА! 🥺");save();render()},5000);
render();log("🐾 Кот проснулся и ждёт тебя!");
</script>
</body></html>
